name: test-npm-package

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:                # gate B.4: reusable workflow para publish-npm.yml

jobs:
  test:
    name: test @dfe-agent/dfe-agent
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: packages/dfe-agent
        run: npm ci || npm install

      - name: Sync assets from DFe-Agent root
        working-directory: packages/dfe-agent
        # Bypass tsx: copia via shell. Mais confiavel em CI que invocar
        # scripts TS via npx/--import (que tem variacoes de argv entre
        # local e CI que quebraram a deteccao em rounds anteriores).
        run: |
          mkdir -p dist/skill/dfe-fiscal
          cp ../../.opencode/agent/dfe-agent.md dist/agent.md
          cp ../../.opencode/skills/dfe-fiscal/SKILL.md dist/skill/dfe-fiscal/SKILL.md
          echo "[sync] copied via shell (CI fallback)"

      - name: Drift check (gate B14.1)
        working-directory: packages/dfe-agent
        run: npm run drift-check

      - name: Build
        working-directory: packages/dfe-agent
        run: npm run build

      - name: Lint (type-check)
        working-directory: packages/dfe-agent
        run: npm run lint

      - name: Test (unit + integration)
        working-directory: packages/dfe-agent
        run: npm test

      - name: E2E smoke (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: packages/dfe-agent
        run: npm run test:e2e

  pytest-regression:
    name: pytest regression (DFe-Agent root)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Gate de regressao: pytest + plugins minimos. Py pipeline (collector,
      # ingest, embeddings) NAO e' necessario para rodar a suite existente.
      # Evita falha por deps pesadas (sentence-transformers, sqlite-vec)
      # que precisam build tools nativos no CI.
      - name: Install pytest + mocks (gate regression only)
        run: pip install pytest==8.4.2 pytest-mock==3.15.1 pytest-cov==6.3.0
      - name: Run pytest (gate zero regressao)
        run: pytest tests/ --no-cov --no-header -q