name: test-npm-package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test @dfe-agent/dfe-agent
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: packages/dfe-agent
        run: npm ci || npm install

      - name: Sync assets from DFe-Agent root
        working-directory: packages/dfe-agent
        run: npm run sync

      - name: Drift check (gate B14.1)
        working-directory: packages/dfe-agent
        run: npm run drift-check

      - name: Build
        working-directory: packages/dfe-agent
        run: npm run build

      - name: Lint (type-check)
        working-directory: packages/dfe-agent
        run: npm run lint

      - name: Test (unit + integration)
        working-directory: packages/dfe-agent
        run: npm test

      - name: E2E smoke (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: packages/dfe-agent
        run: npm run test:e2e

  pytest-regression:
    name: pytest regression (DFe-Agent root)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run pytest (gate zero regressao)
        run: pytest tests/ --no-cov --no-header -q