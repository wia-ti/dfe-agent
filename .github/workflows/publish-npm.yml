name: publish-npm

# DISABLED round 24 (Sprint 14) — user prefere publicacao manual.
# Para re-habilitar CI publish no futuro:
#   1. mude on: para workflow_dispatch (manual) ou tag push
#   2. remova o comentario "if: false" do job publish
#   3. garanta Trusted Publisher configurado em npmjs.com
#
# @see PLAN_SPRINT14.md Task F.1

on:
  workflow_dispatch:    # apenas manual; CI automatico desabilitado
  push:
    tags: ['packages-v*.*.*']  # NAO trigga job (job tem if: false)

permissions:
  contents: write
  id-token: write  # OIDC token para npm Trusted Publisher

jobs:
  test:
    name: Test + drift-check
    uses: ./.github/workflows/test-npm-package.yml
    # Reutiliza o job `test` do workflow de CI matrix.
    # Garante que drift-check, build, lint e test rodam antes de publish.

  publish:
    name: Publish @wiati/dfe-agent to npm
    # Sprint 14 round 24: job desabilitado (if: false). Publicacao agora
    # e' feita manualmente pelo user (npm login + npm publish).
    # Para re-habilitar CI publish no futuro: remover o 'if: false' e
    # restaurar o `needs: test` (apos investigar o bug do cleanup hook).
    needs: ""
    if: false   # ← DISABLED: CI publish desativado round 24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: packages/dfe-agent
        run: npm ci

      - name: Sync assets from DFe-Agent root
        working-directory: packages/dfe-agent
        # Bypass tsx: shell cp (mesmo motivo do test-npm-package.yml)
        run: |
          mkdir -p dist/skill/dfe-fiscal
          cp ../../.opencode/agent/dfe-agent.md dist/agent.md
          cp ../../.opencode/skills/dfe-fiscal/SKILL.md dist/skill/dfe-fiscal/SKILL.md
          echo "[sync] copied via shell (CI fallback)"

      - name: Drift check (gate B.1)
        working-directory: packages/dfe-agent
        run: npm run drift-check

      - name: Build TypeScript
        working-directory: packages/dfe-agent
        run: npm run build

      - name: Verify dist/ exists
        working-directory: packages/dfe-agent
        run: |
          test -f dist/cli.js || (echo "dist/cli.js missing" && exit 1)
          test -f dist/agent.md || (echo "dist/agent.md missing" && exit 1)
          test -f dist/skill/dfe-fiscal/SKILL.md || (echo "dist/skill/dfe-fiscal/SKILL.md missing" && exit 1)

      - name: Verify dist/bin/dfe-agent.js shebang
        working-directory: packages/dfe-agent
        run: |
          head -1 dist/bin/dfe-agent.js | grep -q "^#!/usr/bin/env node" \
            || (echo "missing shebang in dist/bin/dfe-agent.js" && exit 1)

      - name: Publish to npm (Trusted Publisher + provenance)
        # Round 17: usa Trusted Publisher via OIDC. SEM token.
        # 'id-token: write' (permissions acima) emite OIDC token que npm valida.
        # --provenance assina o pacote com attestações build do GitHub.
        working-directory: packages/dfe-agent
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ''  # explicito: NAO usar token. Trusted Publisher via OIDC.

      - name: Verify published package
        working-directory: packages/dfe-agent
        run: |
          echo "Pacote publicado! Verificando em:"
          echo "  https://www.npmjs.com/package/@wiati/dfe-agent"
          npm view @wiati/dfe-agent 2>&1 || echo "(npm view falhou, mas publish step PASSOU)"

      - name: Cleanup tag local (human action)
        if: failure()
        run: |
          echo "::error::publish falhou. Investigar antes de tentar novamente."
          echo "Tag nao foi removida para auditoria. Delete manualmente se necessario:"
          echo "  git push origin :refs/tags/${GITHUB_REF_NAME}"
