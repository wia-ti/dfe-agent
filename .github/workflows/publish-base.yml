name: publish-base

# Publica dfe.db.gz + dfe.db.gz.sha256 como assets do GitHub Release
# quando uma tag v*.*.* e' pushada no DFe-Agent root.
#
# @see PLAN_SPRINT14.md Task D.1

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-base:
    name: Build + publish dfe.db.gz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: python -m src.ragctl migrate

      - name: Collect from official portals
        run: python -m src.collector --once

      - name: Ingest documents (chunking estrutural)
        run: python -m src.indexer.ingest --chunker=structural

      - name: Verify base integrity
        run: |
          python -c "
          import sqlite3
          con = sqlite3.connect('storage/dfe.db')
          uv = con.execute('PRAGMA user_version').fetchone()[0]
          count = con.execute('SELECT COUNT(*) FROM documents').fetchone()[0]
          print(f'schema v{uv}, {count} documents')
          assert uv >= 6, f'schema too old: {uv}'
          assert count > 0, 'no documents ingested'
          con.close()
          "

      - name: Gzip base
        run: gzip -c storage/dfe.db > dfe.db.gz

      - name: SHA-256 checksum
        run: sha256sum dfe.db.gz | awk '{print $1}' > dfe.db.gz.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dfe.db.gz
            dfe.db.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Cleanup artifacts
        if: always()
        run: rm -f dfe.db.gz dfe.db.gz.sha256