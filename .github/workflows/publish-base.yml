name: publish-base

# Publica storage/dfe.db.gz como asset do GitHub Release quando tag v*.*.*
# e' pushada. Consumidores (npm install @wiati/dfe-agent + npx dfe-agent update)
# baixam este asset do release.
#
# Round 18: workflow NAO roda mais o collector Python (que estava travando
# em 'Collect from official portals' no CI Linux). Usa o arquivo pre-buildado
# storage/dfe.db.gz (61 MB) ja' commitado no repo.
#
# @see PLAN_SPRINT14.md Task D.1

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-base:
    name: Build + publish dfe.db.gz
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Verify base file exists
        run: |
          test -f storage/dfe.db.gz || (echo "storage/dfe.db.gz missing" && exit 1)
          test -f storage/dfe.db.gz.sha256 || (echo "storage/dfe.db.gz.sha256 missing" && exit 1)
          echo "OK: pre-buildada base found"
          ls -lh storage/dfe.db.gz storage/dfe.db.gz.sha256

      - name: Compute SHA-256 from file
        id: sha
        run: |
          echo "sha256=$(sha256sum storage/dfe.db.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "expected=$(cat storage/dfe.db.gz.sha256)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Verify SHA-256 (gate B.3)
        run: |
          if [ "${{ steps.sha.outputs.sha256 }}" != "${{ steps.sha.outputs.expected }}" ]; then
            echo "ERROR: SHA mismatch"
            echo "  expected: ${{ steps.sha.outputs.expected }}"
            echo "  actual:   ${{ steps.sha.outputs.sha256 }}"
            exit 1
          fi
          echo "SHA-256 OK: ${{ steps.sha.outputs.sha256 }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            storage/dfe.db.gz
            storage/dfe.db.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Cleanup local artifacts
        if: always()
        run: rm -f storage/dfe.db.gz.tmp storage/dfe.db.gz.sha256.tmp